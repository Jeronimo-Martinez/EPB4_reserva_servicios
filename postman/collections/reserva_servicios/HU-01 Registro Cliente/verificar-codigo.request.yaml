$kind: http-request
name: Verificar Código
order: 5000
method: POST
url: '{{baseUrl}}/api/v1/registrations/verify'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testClientEmail}}",
      "code": "{{verificationCode}}"
    }
events:
  - listen: test
    script:
      exec:
        - pm.test("Status code is 200", () => pm.response.to.have.status(200));
        - "const res = pm.response.json();"
        - pm.test("Response has message", () => pm.expect(res).to.have.property("message"));
        - pm.test("Email matches", () => pm.expect(res.email).to.equal(pm.environment.get("testClientEmail")));
