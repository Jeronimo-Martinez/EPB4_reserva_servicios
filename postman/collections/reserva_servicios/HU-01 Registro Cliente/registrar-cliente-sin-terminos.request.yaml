$kind: http-request
name: Registrar Cliente - Sin Términos
order: 4000
method: POST
url: '{{baseUrl}}/api/v1/registrations'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Ana",
      "lastName": "Gomez",
      "email": "test.no.terms@example.com",
      "phone": "+573001234567",
      "password": "Test1234",
      "termsAccepted": false
    }
events:
  - listen: test
    script:
      exec:
        - pm.test("Status code is 400", () => pm.response.to.have.status(400));
        - "const res = pm.response.json();"
        - pm.test("Error message about terms", () => pm.expect(res.message).to.exist);
