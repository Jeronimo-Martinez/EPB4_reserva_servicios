$kind: http-request
name: Registrar Cliente - Email Duplicado
order: 2000
method: POST
url: '{{baseUrl}}/api/v1/registrations'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Ana",
      "lastName": "Gomez",
      "email": "cliente.demo@example.com",
      "phone": "+573001234567",
      "password": "Test1234",
      "termsAccepted": true
    }
events:
  - listen: test
    script:
      exec:
        - pm.test("Status code is 409", () => pm.response.to.have.status(409));
        - "const res = pm.response.json();"
        - pm.test("Error message about duplicate email", () => pm.expect(res.message).to.include("registrado"));
