$kind: http-request
name: Verificar Código Incorrecto
order: 6000
method: POST
url: '{{baseUrl}}/api/v1/registrations/verify'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testClientEmail}}",
      "code": "000000"
    }
events:
  - listen: test
    script:
      exec:
        - pm.test("Status code is 400", () => pm.response.to.have.status(400));
        - "const res = pm.response.json();"
        - pm.test("Error message about incorrect code", () => pm.expect(res.message).to.exist);
