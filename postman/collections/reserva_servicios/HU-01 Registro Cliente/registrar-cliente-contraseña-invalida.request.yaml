$kind: http-request
name: Registrar Cliente - Contraseña Inválida
order: 3000
method: POST
url: '{{baseUrl}}/api/v1/registrations'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Ana",
      "lastName": "Gomez",
      "email": "test.invalid.pass@example.com",
      "phone": "+573001234567",
      "password": "123",
      "termsAccepted": true
    }
events:
  - listen: test
    script:
      exec:
        - pm.test("Status code is 400", () => pm.response.to.have.status(400));
        - "const res = pm.response.json();"
        - pm.test("Error message about password", () => pm.expect(res.message).to.exist);
