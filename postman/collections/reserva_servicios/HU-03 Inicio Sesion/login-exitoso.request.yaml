$kind: http-request
name: Login Exitoso
order: 1000
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "cliente.demo@example.com",
      "password": "Cliente123"
    }
events:
  - listen: test
    script:
      exec:
        - pm.test("Status code is 200", () => pm.response.to.have.status(200));
        - "const res = pm.response.json();"
        - pm.test("Response has message", () => pm.expect(res).to.have.property("message"));
        - pm.test("Response has role", () => pm.expect(res).to.have.property("role"));
        - pm.test("Response has redirectTo", () => pm.expect(res).to.have.property("redirectTo"));
        - pm.test("Role is CLIENTE", () => pm.expect(res.role).to.equal("CLIENTE"));
