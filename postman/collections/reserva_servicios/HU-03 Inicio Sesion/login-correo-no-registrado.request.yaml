$kind: http-request
name: Login Correo No Registrado
order: 3000
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "noexiste@test.com",
      "password": "Test1234"
    }
events:
  - listen: test
    script:
      exec:
        - pm.test("Status code is 401", () => pm.response.to.have.status(401));
        - "const res = pm.response.json();"
        - pm.test("Error message present", () => pm.expect(res.message).to.exist);
