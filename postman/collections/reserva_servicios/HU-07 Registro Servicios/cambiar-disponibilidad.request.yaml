$kind: http-request
name: Cambiar Disponibilidad
order: 8000
method: PATCH
url: '{{baseUrl}}/api/v1/services/{{createdServiceId}}/availability'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "providerEmail": "centro.vital@example.com",
      "available": false
    }
events:
  - listen: test
    script:
      exec:
        - pm.test("Status code is 200", () => pm.response.to.have.status(200));
        - "const res = pm.response.json();"
        - pm.test("Available is false", () => pm.expect(res.available).to.be.false);
