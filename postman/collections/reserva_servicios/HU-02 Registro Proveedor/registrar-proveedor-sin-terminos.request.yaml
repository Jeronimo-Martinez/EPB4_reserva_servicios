$kind: http-request
name: Registrar Proveedor - Sin Términos
order: 4000
method: POST
url: '{{baseUrl}}/api/v1/registrations/provider'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Carlos",
      "lastName": "Lopez",
      "email": "test.proveedor.no.terms@example.com",
      "phone": "+573009876543",
      "password": "Test1234",
      "termsAccepted": false,
      "businessName": "Negocio Test",
      "businessCategory": "EDUCACION",
      "businessDescription": "Test",
      "address": "Calle 123"
    }
events:
  - listen: test
    script:
      exec:
        - pm.test("Status code is 400", () => pm.response.to.have.status(400));
        - "const res = pm.response.json();"
        - pm.test("Error message about terms", () => pm.expect(res.message).to.exist);
