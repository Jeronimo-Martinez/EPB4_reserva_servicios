$kind: http-request
name: Cancelar Reserva
order: 5000
method: POST
url: '{{baseUrl}}/api/v1/schedule/reservations/{{reservationId}}/cancel'
headers:
  - key: Authorization
    value: Bearer {{token}}
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "El profesional asignado no estara disponible"
    }
