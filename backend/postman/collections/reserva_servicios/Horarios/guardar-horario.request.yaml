        { "dayOfWeek": "WEDNESDAY", "startTime": "08:00", "endTime": "18:00" },
        { "dayOfWeek": "THURSDAY", "startTime": "08:00", "endTime": "18:00" },
        { "dayOfWeek": "FRIDAY", "startTime": "08:00", "endTime": "18:00" },
        { "dayOfWeek": "SATURDAY", "startTime": "09:00", "endTime": "13:00" }
      ]
