spring.application.name=reserva_servicios
# Hosting platforms like Render assign the port through PORT.
server.port=${PORT:8080}
# DB_URL, DB_USERNAME and DB_PASSWORD come from env vars or backend/.env (see .env.example); defaults keep the local Postgres.
# Second path covers running from the repo root (IntelliJ's default working directory here).
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reserva_servicios_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:694889}
# Supabase's free pooler allows few connections per project, and every teammate's backend shares them.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
