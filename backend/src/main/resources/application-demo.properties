spring.datasource.url=jdbc:h2:mem:reserva_servicios_demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.mail.enabled=false

# reCAPTCHA desactivado en perfil demo (H2) para pruebas sin internet
app.recaptcha.enabled=false
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify